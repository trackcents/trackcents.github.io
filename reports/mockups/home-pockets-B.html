<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: oklch(0.965 0.013 78);
        --surface: oklch(1 0 0);
        --elevated: oklch(0.975 0.01 78);
        --border: oklch(0.9 0.011 72);
        --text: oklch(0.28 0.014 55);
        --muted: oklch(0.53 0.018 58);
        --accent: oklch(0.62 0.125 45);
        --accent2: oklch(0.68 0.11 58);
        --accent-soft: oklch(0.93 0.04 55);
        --success: oklch(0.58 0.15 158);
        --grad: linear-gradient(135deg, oklch(0.62 0.13 44), oklch(0.69 0.11 60));
      }
      * { box-sizing: border-box; margin: 0; font-family: 'Inter', system-ui, sans-serif; }
      body { width: 390px; background: var(--bg); color: var(--text); padding: 16px 16px 88px; }
      .topbar { display: flex; justify-content: center; margin-bottom: 14px; }
      .month { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 0.92rem; }
      .month small { color: var(--muted); font-weight: 500; }
      .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 20px 18px; box-shadow: 0 2px 12px rgba(60,40,20,0.06); margin-bottom: 14px; }
      .hlbl { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
      .hbig { font-size: 2.7rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin-top: 2px; }
      .segbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin: 16px 0 10px; gap: 2px; }
      .seg1 { background: var(--grad); }
      .seg2 { background: var(--accent2); }
      .seg3 { background: var(--elevated); }
      .legend { display: flex; gap: 16px; font-size: 0.76rem; color: var(--muted); }
      .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
      .pocket { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 13px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
      .chip { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 18px; flex: none; }
      .pname { font-weight: 700; font-size: 0.95rem; }
      .pmeta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
      .mini { height: 6px; border-radius: 999px; background: var(--elevated); margin-top: 7px; overflow: hidden; }
      .mfill { height: 100%; border-radius: 999px; }
      .pright { text-align: right; flex: none; }
      .pamt { font-weight: 800; font-size: 1.05rem; }
      .psmall { font-size: 0.68rem; color: var(--muted); }
      .mid { flex: 1; min-width: 0; }
      .addbox { border: 1.5px dashed var(--border); border-radius: 14px; padding: 12px; text-align: center; color: var(--accent); font-weight: 600; font-size: 0.88rem; }
      .tabbar { position: fixed; bottom: 0; left: 0; width: 390px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 8px 0 12px; }
      .tab { font-size: 0.62rem; color: var(--muted); text-align: center; }
      .tab.on { color: var(--accent); font-weight: 600; }
      .tab .ic { font-size: 17px; display: block; }
      .fab { width: 46px; height: 46px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 24px; margin-top: -18px; box-shadow: 0 4px 12px rgba(180,90,40,0.4); }
    </style>
  </head>
  <body>
    <div class="topbar"><div class="month">May 2026 &nbsp;<small>· this cycle</small> ⌄</div></div>

    <div class="hero">
      <div class="hlbl">Remaining this cycle</div>
      <div class="hbig">$2,500</div>
      <div class="segbar">
        <div class="seg1" style="flex: 2000"></div>
        <div class="seg2" style="flex: 500"></div>
        <div class="seg3" style="flex: 2790"></div>
      </div>
      <div class="legend">
        <span><span class="dot" style="background: var(--accent)"></span>Paychecks $2,000</span>
        <span><span class="dot" style="background: var(--accent2)"></span>Extra $500</span>
      </div>
    </div>

    <div class="pocket">
      <div class="chip" style="background: oklch(0.95 0.05 158); color: var(--success)">💵</div>
      <div class="mid">
        <div class="pname">Paychecks</div>
        <div class="pmeta">of $7,290 · 73% used</div>
        <div class="mini"><div class="mfill" style="width: 73%; background: var(--grad)"></div></div>
      </div>
      <div class="pright"><div class="pamt">$2,000</div><div class="psmall">left ›</div></div>
    </div>

    <div class="pocket">
      <div class="chip" style="background: var(--accent-soft); color: var(--accent)">🎁</div>
      <div class="mid">
        <div class="pname">Extra</div>
        <div class="pmeta">of $1,000 · 50% used</div>
        <div class="mini"><div class="mfill" style="width: 50%; background: var(--accent2)"></div></div>
      </div>
      <div class="pright"><div class="pamt">$500</div><div class="psmall">left ›</div></div>
    </div>

    <div class="addbox">＋ Add income box</div>

    <div class="tabbar">
      <div class="tab on"><span class="ic">⌂</span>Home</div>
      <div class="tab"><span class="ic">≣</span>Transactions</div>
      <div class="fab">＋</div>
      <div class="tab"><span class="ic">↑</span>Statements</div>
      <div class="tab"><span class="ic">☰</span>More</div>
    </div>
  </body>
</html>
