<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: oklch(0.965 0.013 78);
        --surface: oklch(1 0 0);
        --elevated: oklch(0.975 0.01 78);
        --border: oklch(0.9 0.011 72);
        --text: oklch(0.28 0.014 55);
        --muted: oklch(0.53 0.018 58);
        --accent: oklch(0.62 0.125 45);
        --accent2: oklch(0.68 0.11 58);
        --accent-soft: oklch(0.93 0.04 55);
        --success: oklch(0.58 0.15 158);
        --danger: oklch(0.57 0.21 22);
        --grad: linear-gradient(135deg, oklch(0.62 0.13 44), oklch(0.69 0.11 60));
      }
      * { box-sizing: border-box; margin: 0; font-family: 'Inter', system-ui, sans-serif; }
      body { width: 390px; background: var(--bg); color: var(--text); padding: 16px 16px 88px; }
      .topbar { display: flex; justify-content: center; margin-bottom: 14px; }
      .month { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 0.92rem; }
      .month small { color: var(--muted); font-weight: 500; }
      .seclabel { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 2px 4px 8px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px; box-shadow: 0 2px 10px rgba(60,40,20,0.05); }
      .thead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .chip { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; }
      .tname { font-weight: 700; font-size: 0.9rem; }
      .tamt { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
      .tamt.neg { color: var(--danger); }
      .tlbl { font-size: 0.68rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 3px; }
      .tmeta { font-size: 0.72rem; color: var(--muted); margin: 9px 0 7px; }
      .bar { height: 7px; border-radius: 999px; background: var(--elevated); overflow: hidden; }
      .fill { height: 100%; border-radius: 999px; }
      .over { font-size: 0.68rem; color: var(--danger); font-weight: 600; margin-top: 6px; }
      .addbox { border: 1.5px dashed var(--border); border-radius: 14px; padding: 12px; text-align: center; color: var(--accent); font-weight: 600; font-size: 0.88rem; margin: 12px 0 16px; }
      .bills .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 0.88rem; }
      .bills .row:first-of-type { border-top: 0; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(60,40,20,0.05); }
      .tick { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--border); flex: none; display: grid; place-items: center; font-size: 11px; color: #fff; }
      .tick.done { background: var(--success); border-color: var(--success); }
      .bname { flex: 1; } .bname.paid { color: var(--muted); text-decoration: line-through; }
      .bamt { font-weight: 600; }
      .tabbar { position: fixed; bottom: 0; left: 0; width: 390px; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 8px 0 12px; }
      .tab { font-size: 0.62rem; color: var(--muted); text-align: center; }
      .tab.on { color: var(--accent); font-weight: 600; }
      .tab .ic { font-size: 17px; display: block; }
      .fab { width: 46px; height: 46px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 24px; margin-top: -18px; box-shadow: 0 4px 12px rgba(180,90,40,0.4); }
    </style>
  </head>
  <body>
    <div class="topbar"><div class="month">May 2026 &nbsp;<small>· this cycle</small> ⌄</div></div>
    <div class="seclabel">Income · what's left</div>

    <div class="grid">
      <div class="tile">
        <div class="thead">
          <div class="chip" style="background: oklch(0.95 0.05 158); color: var(--success)">💵</div>
          <div class="tname">Paychecks</div>
        </div>
        <div class="tamt neg">−$50</div>
        <div class="tlbl">over by $50</div>
        <div class="tmeta">of $7,290 · 101%</div>
        <div class="bar"><div class="fill" style="width: 100%; background: var(--danger)"></div></div>
        <div class="over">⚠ slightly over this cycle</div>
      </div>

      <div class="tile">
        <div class="thead">
          <div class="chip" style="background: var(--accent-soft); color: var(--accent)">🎁</div>
          <div class="tname">Extra</div>
        </div>
        <div class="tamt">$500</div>
        <div class="tlbl">remaining</div>
        <div class="tmeta">of $1,000 · 50%</div>
        <div class="bar"><div class="fill" style="width: 50%; background: var(--accent2)"></div></div>
      </div>
    </div>

    <div class="addbox">＋ Add income box</div>

    <div class="seclabel">Bills this cycle · 2 of 8 paid</div>
    <div class="card bills">
      <div class="row"><span class="tick done">✓</span><span class="bname paid">House EMI</span><span class="bamt">$2,200</span> 💵</div>
      <div class="row"><span class="tick done">✓</span><span class="bname paid">Car EMI</span><span class="bamt">$1,250</span> 💵</div>
      <div class="row"><span class="tick"></span><span class="bname">India</span><span class="bamt">$1,550</span> 💵</div>
    </div>

    <div class="tabbar">
      <div class="tab on"><span class="ic">⌂</span>Home</div>
      <div class="tab"><span class="ic">≣</span>Transactions</div>
      <div class="fab">＋</div>
      <div class="tab"><span class="ic">↑</span>Statements</div>
      <div class="tab"><span class="ic">☰</span>More</div>
    </div>
  </body>
</html>
